name: Build Windows desktop installer

on:
  workflow_dispatch:
  push:
    branches: ['desktop/**']
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'tests/test_desktop.py'
      - 'docs/windows-desktop.md'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress --version=6.7.1
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          & $compiler /?
      - name: Build and smoke-test executable and installer
        shell: pwsh
        run: ./desktop/windows/build.ps1 -PythonExe (Get-Command python).Source
      - name: Verify silent installer and installed GUI
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ChromoPlas Installer Test'
          $setup = (Get-ChildItem dist/desktop/ChromoPlas-Setup-*.exe | Select-Object -First 1).FullName
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $target + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer smoke test failed' }
          $app = Start-Process (Join-Path $target 'ChromoPlas.exe') -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Installed GUI smoke test failed' }
      - name: Upload Windows installation files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChromoPlas-Windows-x64-preview
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 30

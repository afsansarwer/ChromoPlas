name: ChromoPlas unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python package and tests
        run: python -m pip install -e '.[test]'
      - name: Validate localization and QC logic
        run: python -m pytest -q
      - name: Smoke-test Snakemake planning for one FASTA
        run: chromoplas examples/genomes/test_isolate.fna -o /tmp/chromoplas-ci-results --dry-run
      - name: Compile package code
        run: python -m compileall -q src
      - name: Check shell scripts for syntax errors
        run: bash -n scripts/check-install.sh scripts/update-all.sh
      - name: Validate citation metadata
        run: python -c "import yaml; x=yaml.safe_load(open('CITATION.cff')); assert x['cff-version']=='1.2.0'"

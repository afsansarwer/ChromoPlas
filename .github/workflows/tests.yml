name: ChromoPlas unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python package and tests
        run: python -m pip install -e '.[test]'
      - name: Validate localization and QC logic
        run: python -m pytest -q
      - name: Compile package code
        run: python -m compileall -q src
      - name: Validate citation metadata
        run: python -c "import yaml; x=yaml.safe_load(open('CITATION.cff')); assert x['cff-version']=='1.2.0'"

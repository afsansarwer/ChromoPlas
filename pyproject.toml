[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromoplas"
version = "0.3.0"
description = "Lightweight bacterial genome workflow for contig-resolved chromosome/plasmid ARG, virulence and mobile-element localization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Afsan Sarwer"}]
dependencies = ["typer>=0.12", "PyYAML>=6", "snakemake>=8,<10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chromoplas = "chromoplas.cli:main"

[tool.setuptools.package-data]
chromoplas = ["workflow/*", "default_config.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
